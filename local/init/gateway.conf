# The single origin supabase-js talks to.
#
# A hosted Supabase project puts REST, Auth and Storage behind one hostname and
# splits them by path prefix; supabase-js hard-codes those prefixes. Assembling
# the services ourselves means reproducing that routing, or every URL the
# client builds points at nothing.
#
# The upstream names (rest/auth/storage) are container aliases, and are the
# same under docker compose and under testcontainers — which is what lets this
# one file serve both.
server {
  listen 8000;
  # Uploads go through here; nginx's 1m default would reject them long before
  # the storage API's own limit had an opinion.
  client_max_body_size 50m;

  # Docker's embedded DNS. Naming a resolver is what allows the upstreams below
  # to be held in variables, and *that* is what defers name resolution to the
  # first request. With a literal hostname nginx resolves at startup and exits
  # if a service is not up yet, which turns "started in the wrong order" into a
  # dead gateway that never recovers.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Resolution being deferred, the prefix has to be stripped by hand — the
  # trailing-slash form of proxy_pass is not available with a variable. The
  # capture group is the path as the service expects it: /rest/v1/trips
  # reaches PostgREST as /trips.
  location ~ ^/rest/v1/(.*)$ {
    set $rest_upstream http://rest:3000;
    proxy_pass $rest_upstream/$1$is_args$args;
    proxy_set_header Host $host;
  }

  location ~ ^/auth/v1/(.*)$ {
    set $auth_upstream http://auth:9999;
    proxy_pass $auth_upstream/$1$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/storage/v1/(.*)$ {
    set $storage_upstream http://storage:5000;
    proxy_pass $storage_upstream/$1$is_args$args;
    proxy_set_header Host $host;
  }

  # Somewhere to point a readiness check that doesn't wake the services.
  location = /gateway-health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
